[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galaxies-creative-intelligence"
version = "0.1.0"
description = "Pre-publication creative evaluation with auditable multimodal models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Guilherme Holanda"}]
dependencies = [
  "catboost>=1.2.8,<2", "numpy>=2.0,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "pyarrow>=18,<24",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "typer>=0.15,<1", "rich>=13.9,<15",
  "pillow>=11,<13", "mcp>=1.20,<2", "langgraph>=1.0,<2",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2"]
vision = ["open-clip-torch>=2.30,<4", "torch>=2.5,<3"]
ocr = ["rapidocr-onnxruntime>=1.4,<2"]
tracking = ["mlflow-skinny>=3,<4"]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
galaxies = "galaxies.cli:app"
galaxies-mcp = "galaxies.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galaxies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
